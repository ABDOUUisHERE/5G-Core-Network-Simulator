name: Core5G quality
on:
  push:
    branches: [main, 'chore/**', 'feature/**', 'test/**']
  pull_request:
permissions:
  contents: read
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: core5g
          POSTGRES_PASSWORD: local-lab-admin
          POSTGRES_DB: core5g
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U core5g" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './api/gen/*'))"
      - run: go vet ./...
      - run: PGPASSWORD=local-lab-admin psql -h localhost -U core5g -d core5g -v ON_ERROR_STOP=1 -f migrations/001_initial.sql
      - run: go test -race ./... -coverprofile=coverage.out -count=1
        env:
          CORE5G_TEST_POSTGRES: postgres://core5g:local-lab-admin@localhost:5432/core5g?sslmode=disable
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o bin/core5g.exe ./cmd/core5g
      - uses: actions/upload-artifact@v4
        with:
          name: core5g-windows
          path: bin/core5g.exe
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: python3 tests/e2e/acceptance.py
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 tests/performance/load.py --count 1000 --concurrency 50 --output test-results/performance.json
      - if: always()
        run: mkdir -p test-results && docker compose logs --no-color > test-results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-evidence
          path: test-results/
      - if: always()
        run: docker compose down

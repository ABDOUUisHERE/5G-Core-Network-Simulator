name: Core5G quality
on:
  push:
    branches: [main]
  pull_request:
permissions:
  contents: read
concurrency:
  group: core5g-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
jobs:
  go:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: core5g
          POSTGRES_PASSWORD: local-lab-admin
          POSTGRES_DB: core5g
        ports: ['5432:5432']
        options: --health-cmd "pg_isready -U core5g" --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
      - run: test -z "$(gofmt -l $(find . -name '*.go' -not -path './api/gen/*'))"
      - run: go vet ./...
      - run: PGPASSWORD=local-lab-admin psql -h localhost -U core5g -d core5g -v ON_ERROR_STOP=1 -f migrations/001_initial.sql
      - run: go test -race ./... -coverprofile=coverage.out -count=1
        env:
          CORE5G_TEST_POSTGRES: postgres://core5g:local-lab-admin@localhost:5432/core5g?sslmode=disable
      - run: python3 scripts/check_coverage.py coverage.out
      - uses: actions/upload-artifact@v4
        with:
          name: go-coverage
          path: coverage.out
      - run: GOOS=windows GOARCH=amd64 CGO_ENABLED=0 go build -trimpath -o bin/core5g.exe ./cmd/core5g
      - uses: actions/upload-artifact@v4
        with:
          name: core5g-windows
          path: bin/core5g.exe
  system:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
      - run: docker compose up -d --build --wait --wait-timeout 240
      - run: python3 tests/e2e/acceptance.py
      - run: python3 tests/e2e/observability.py
      - run: npm ci && npx playwright install --with-deps chromium
      - run: npm run test:browser
      - run: python3 tests/performance/load.py --count 1000 --concurrency 50 --output test-results/performance.json
      - run: docker run --rm --network host -v "$PWD:/src" -w /src golang:1.25-bookworm go run ./tests/performance/burst --count 1000 --concurrency 1000 --output test-results/burst.json
      - if: always()
        run: mkdir -p test-results && docker compose logs --no-color > test-results/compose.log
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: system-evidence
          path: test-results/
      - if: always()
        run: docker compose down
  kubernetes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - run: python3 scripts/kubernetes.py --check
      - run: |
          curl -fsSL https://kind.sigs.k8s.io/dl/v0.33.0/kind-linux-amd64 -o "$RUNNER_TEMP/kind"
          chmod +x "$RUNNER_TEMP/kind"
          export PATH="$RUNNER_TEMP:$PATH"
          echo "$RUNNER_TEMP" >> "$GITHUB_PATH"
          kind create cluster --name core5g-lab --config deployments/kubernetes/kind-config.yaml --wait 120s
      - run: docker build -t core5g:local -f deployments/docker/Dockerfile . && kind load docker-image core5g:local --name core5g-lab
      - run: |
          kubectl apply -f deployments/kubernetes/core5g.json
          for service in postgres udm ausf amf smf upf gnb-simulator control-api; do
            kubectl rollout status deployment/$service -n core5g --timeout=240s
          done
      - run: CORE5G_URL=http://127.0.0.1:8086 python3 tests/e2e/acceptance.py
      - run: python3 tests/e2e/observability.py --profile kind
      - if: always()
        run: |
          mkdir -p test-results
          kubectl get pods -n core5g -o wide > test-results/kubernetes-pods.txt
          kubectl get events -n core5g --sort-by=.lastTimestamp > test-results/kubernetes-events.txt
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: kubernetes-evidence
          path: test-results/
      - if: always()
        run: kind delete cluster --name core5g-lab
